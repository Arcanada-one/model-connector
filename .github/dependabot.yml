# Managed by SEC-0034. Directories are derived from the repository tree,
# not templated — a config naming absent paths silently updates nothing.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # Security fixes for TRANSITIVE packages (e.g. nanoid via postcss) cannot be
    # applied by editing package.json — they need the lockfile refreshed. Without
    # allowing indirect updates the scheduled runs simply fail, as six arcanadas
    # jobs did on 2026-08-09.
    allow:
      - dependency-type: "all"
    groups:
      # Grouped so routine upkeep arrives as few reviewable PRs, while
      # majors stay separate — a batched major bump hides breakage.
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "npm"
    directory: "/packages/sdk-ts"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # Security fixes for TRANSITIVE packages (e.g. nanoid via postcss) cannot be
    # applied by editing package.json — they need the lockfile refreshed. Without
    # allowing indirect updates the scheduled runs simply fail, as six arcanadas
    # jobs did on 2026-08-09.
    allow:
      - dependency-type: "all"
    groups:
      # Grouped so routine upkeep arrives as few reviewable PRs, while
      # majors stay separate — a batched major bump hides breakage.
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "pip"
    directory: "/packages/sdk-python"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Security fixes for TRANSITIVE packages (e.g. nanoid via postcss) cannot be
    # applied by editing package.json — they need the lockfile refreshed. Without
    # allowing indirect updates the scheduled runs simply fail, as six arcanadas
    # jobs did on 2026-08-09.
    allow:
      - dependency-type: "all"
    groups:
      # Grouped so routine upkeep arrives as few reviewable PRs, while
      # majors stay separate — a batched major bump hides breakage.
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Grouped so routine upkeep arrives as few reviewable PRs, while
      # majors stay separate — a batched major bump hides breakage.
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # Base images are where OS-level CVEs accumulate, and a digest-pinned FROM
    # cannot rot visibly -- nobody reads a sha256 and notices it is a year old.
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to a pull-request branch supersedes that branch's older run, which
# otherwise keeps queueing on the shared self-hosted runners. Only pull_request
# runs are ever cancelled: push (main), tag, schedule and workflow_dispatch runs get
# a group unique to the run, so they are never cancelled or replaced while pending.
# Job-level deploy locks are separate groups and are not touched.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint-and-test:
    # A2-315: pre-deploy gates run on the dedicated `deploy-gate` lane, not on `ci-general`, where
    # KC2 batteries held all five slots for hours (argana 95 min, muneral 150 min in the queue on
    # 2026-09-24/25). The lane's runners carry ONLY that label (--no-default-labels): nothing else lands there.
    # DEC-AUP-0101 O3: pull requests use the existing unprivileged ci-nodocker lane.
    # Main pre-deploy checks retain deploy-gate; Docker e2e retains ci-general.
    runs-on: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && fromJSON('["deploy-gate"]') || fromJSON('["ci-nodocker"]') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Provision pinned Compose CLI in PR job temp (no daemon)
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          [ "$(uname -m)" = x86_64 ] || { echo "Unsupported Compose CLI architecture" >&2; exit 1; }
          compose_root="${RUNNER_TEMP}/o3-compose-cli"
          mkdir -p "$compose_root/cli-plugins"
          curl --fail --silent --show-error --location --retry 2 --connect-timeout 10 --max-time 120 \
            https://github.com/docker/compose/releases/download/v5.6.0/docker-compose-linux-x86_64 \
            --output "$compose_root/cli-plugins/docker-compose"
          printf '%s  %s\n' \
            40343e21ca777173e69cff5dbafeb37c6f81f3b0d57d9e597f036e95eb63e76a \
            "$compose_root/cli-plugins/docker-compose" | sha256sum --check --strict
          chmod 700 "$compose_root/cli-plugins/docker-compose"
          printf 'DOCKER_CONFIG=%s\n' "$compose_root" >> "$GITHUB_ENV"
          DOCKER_CONFIG="$compose_root" docker compose version

      - name: PR runner tooling qualification (DEC-AUP-0101 O3)
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          # Read versions only; never contact a daemon or install host packages.
          command -v docker
          docker --version
          docker compose version
          command -v shellcheck
          shellcheck --version
          command -v bats
          bats --version

      - name: Credential documentation regression
        run: bash dev-tools/credential-docs-regression.sh

      - name: Full-suite declaration boundary controls
        run: |
          bash -n scripts/graph-full-suite.sh
          PYTHONDONTWRITEBYTECODE=1 python3 -B dev-tools/graph-full-suite.test.py

      # ARAS-0058 — BILLING_ENFORCED was declared nowhere outside src/: not in
      # .env.example, not in docker-compose.yml, not in deploy/, not here. It
      # was set by hand on the prod container, so the next deploy that rebuilt
      # the env from the template would have silently disabled billing — and
      # the failure mode is SUCCESSFUL FREE SERVICE, which nothing alerts on.
      # This fails the PR that drops the declaration.
      - name: Env declaration parity
        run: |
          bash -n dev-tools/env-declaration-parity.sh
          bash dev-tools/env-declaration-parity.sh

      - name: Fixed aggregate readback broker contract
        run: |
          bash -n deploy/arcanada-compose-broker.sh
          bash -n deploy/arcanada-compose-broker.test.sh
          bash -n deploy/arcanada-compose-broker-config-contract.test.sh
          bash -n deploy/arcanada-compose-broker-kcc-contract.test.sh
          bash deploy/arcanada-compose-broker-config-contract.test.sh
          bash deploy/arcanada-compose-broker-kcc-contract.test.sh
          bash deploy/arcanada-compose-broker.test.sh
          PYTHONDONTWRITEBYTECODE=1 python3 deploy/test_billing_transaction.py
          PYTHONDONTWRITEBYTECODE=1 python3 deploy/test_billing_installer.py
          PYTHONDONTWRITEBYTECODE=1 python3 -B deploy/test_prime_native_capture.py
          PYTHONDONTWRITEBYTECODE=1 python3 -B deploy/test_prime_first_install.py
          PYTHONDONTWRITEBYTECODE=1 python3 -B deploy/test_broker_caller_environment.py
          PYTHONDONTWRITEBYTECODE=1 python3 -B deploy/test_prime_candidate_receiving.py
          PYTHONDONTWRITEBYTECODE=1 python3 -B deploy/tests/test_bench_monetary_manifest.py
          PYTHONDONTWRITEBYTECODE=1 python3 -B deploy/test_bench_account_receiving.py
          PYTHONDONTWRITEBYTECODE=1 python3 -B deploy/test_bench_receiving_package.py
          bash -n deploy/deploy.sh deploy/deploy.test.sh
          bash deploy/deploy.test.sh
          bash -n deploy/digest-promotion-contract.test.sh
          bash deploy/digest-promotion-contract.test.sh
          bash -n deploy/compose-network.test.sh
          bash deploy/compose-network.test.sh
      # INFRA-0462 — watcher/test/*.bats existed from the day the watcher landed
      # and no step ever ran them. Specs nothing invokes are the same shape as
      # the defect this PR fixes: a check that cannot fail. shellcheck runs over
      # the deploy scripts here for the same reason -- they are shipped code that
      # runs as root on a timer, and nothing was reading them.
      #
      # Both tools are present system-wide on the ci-general pool (verified in a
      # non-login shell as each runner user, which is how a step actually sees
      # PATH). A missing tool fails the step loudly rather than skipping: a
      # fail-soft skip here would hide exactly the class of defect below.
      - name: Watcher deploy scripts and specs
        run: |
          command -v shellcheck >/dev/null || { echo "shellcheck missing on this runner"; exit 1; }
          command -v bats >/dev/null || { echo "bats missing on this runner"; exit 1; }
          shellcheck -S warning watcher/deploy/*.sh watcher/scripts/*.sh
          # Named, not `bats watcher/test/`: classification.bats needs a built
          # watcher/dist that no CI step produces, so sweeping the directory
          # would wire in a step that is red on arrival -- and a step that is
          # always red is a step everybody learns to skip. Tracked as its own
          # task (INFRA-0471) rather than silenced with a skip here.
          bats watcher/test/health-selfcheck.bats

      # `dest` is pinned per job on purpose. Several runners on a host share
      # one OS user, so the action default `~/setup-pnpm` is ONE directory that
      # concurrent jobs install pnpm into simultaneously and corrupt (A2-227).
      # `runner.temp` is per runner and per job. Do not drop this.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.23.4'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm db:generate
        env:
          DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Rate-limit CI report negative controls
        run: |
          pnpm exec tsc --noEmit --project tsconfig.ci.json
          node --test dev-tools/rate-limit-ci-report.test.mjs
          PYTHONDONTWRITEBYTECODE=1 python3 dev-tools/rate-limit-ci-workflow.test.py

  docker-e2e:
    runs-on: [self-hosted, Linux, ci-general]
    needs: lint-and-test
    concurrency:
      group: docker-e2e-arcana-prod
      cancel-in-progress: false
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: connector_test
        ports:
          - 15432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 16379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build isolated rate-limit test stage
        run: |
          set -euo pipefail
          # Do not copy a runner's leftover dotenv override into the test image.
          for file in .env .env.local .env.integration .env.integration.local; do
            { test ! -e "$file" && test ! -L "$file"; } || { echo "Unexpected dotenv override in test checkout" >&2; exit 1; }
          done
          docker buildx build --target build --load -t "model-connector-rate-limit-test:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" .

      - name: Build Docker image
        run: docker buildx build --load --build-arg MC_BUILD_SHA="$GITHUB_SHA" -t "model-connector-e2e:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" .

      - name: Verify disabled receiver image provenance
        run: |
          docker run --rm --network=none --read-only --entrypoint python3 \
            "model-connector-e2e:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" -B /app/deploy/bench-receiving-package.py verify "$GITHUB_SHA"

      - name: Create DB schema
        run: |
          docker run --rm --network=host \
            -e DATABASE_URL=postgresql://test:test@localhost:15432/connector_test \
            "model-connector-e2e:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" npx prisma migrate deploy

      - name: Verify first-dispatch PostgreSQL invariants
        run: |
          docker run --rm --network=host --entrypoint node \
            -e DATABASE_URL=postgresql://test:test@localhost:15432/connector_test \
            -v "$PWD/dev-tools/first-dispatch-observation-db-contract.mjs:/app/first-dispatch-observation-db-contract.mjs:ro" \
            "model-connector-e2e:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" /app/first-dispatch-observation-db-contract.mjs

      - name: Six rate-limit assertions against disposable stores
        run: |
          set -euo pipefail
          name="mc-rate-limit-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            # Only this run's disposable test container, never a service or runner.
            timeout --kill-after=5s 15s docker rm -f "$name" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          # shellcheck disable=SC2016 # The single-quoted script expands inside the container.
          timeout --kill-after=5s 90s docker run --rm --init --name "$name" --network=host \
            --user "$(id -u):$(id -g)" \
            --entrypoint sh \
            -e HOME=/tmp \
            -e NODE_ENV=test \
            -e CI=1 \
            -e DATABASE_URL=postgresql://test:test@localhost:15432/connector_test \
            -e REDIS_HOST=127.0.0.1 \
            -e REDIS_PORT=16379 \
            -e REDIS_PREFIX="mc-rate-limit-ci:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}:" \
            "model-connector-rate-limit-test:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" -ec '
              for file in .env .env.local .env.integration .env.integration.local; do
                { test ! -e "$file" && test ! -L "$file"; } || { echo "Unexpected dotenv override in test image" >&2; exit 1; }
              done
              node node_modules/vitest/vitest.mjs run src/auth/rate-limit.integration.spec.ts \
                --config vitest.integration.config.ts --mode integration --no-cache \
                --reporter=json --outputFile=/tmp/mc-rate-limit-result.json
              node dev-tools/rate-limit-ci-report.mjs /tmp/mc-rate-limit-result.json
            '

      - name: Start container
        run: |
          docker run -d --name mc-e2e --network=host \
            -e DATABASE_URL=postgresql://test:test@localhost:15432/connector_test \
            -e REDIS_HOST=localhost \
            -e REDIS_PORT=16379 \
            -e NODE_ENV=test \
            -e PORT=3900 \
            -e STT_PROVIDER_GROQ_ENABLED=false \
            "model-connector-e2e:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          # STT_PROVIDER_GROQ_ENABLED defaults true (env.schema), which makes the
          # boot-time env validation require STT_GROQ_API_KEY. The e2e harness does
          # not exercise STT and injects no provider key, so disable the Groq STT
          # provider here. Prod is unaffected (its .env supplies GROQ_API_KEY).

      - name: Wait for healthy
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3900/health > /dev/null 2>&1; then
              echo "Health check passed on attempt $i"
              exit 0
            fi
            sleep 2
          done
          echo "Health check failed after 60s"
          docker logs mc-e2e
          exit 1

      - name: Smoke tests
        run: |
          echo "=== GET /health ==="
          curl -fsS http://localhost:3900/health | jq .

          echo "=== GET /health/ready ==="
          READY_HTTP=$(curl -sS -o /tmp/mc-health-ready.json -w '%{http_code}' http://localhost:3900/health/ready)
          jq . /tmp/mc-health-ready.json
          if [ "$READY_HTTP" = "200" ]; then
            jq -e '(.status == "ok" or .status == "degraded") and .checks.database == "ok"' /tmp/mc-health-ready.json > /dev/null
          elif [ "$READY_HTTP" = "503" ]; then
            jq -e '.status == "error" and .checks.database == "ok" and any(.providers[]; .connector == "deepseek" and (.state == "missing" or .state == "rejected"))' /tmp/mc-health-ready.json > /dev/null
          else
            echo "Unexpected /health/ready HTTP $READY_HTTP"
            exit 1
          fi

          echo "=== POST /execute without auth → expect 401 ==="
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:3900/execute \
            -H 'Content-Type: application/json' \
            -d '{"connector":"claude-code","prompt":"test"}')
          if [ "$STATUS" != "401" ]; then
            echo "Expected 401, got $STATUS"
            exit 1
          fi
          echo "Auth guard OK: 401"

          echo "=== GET /connectors → expect 401 ==="
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3900/connectors)
          if [ "$STATUS" != "401" ]; then
            echo "Expected 401, got $STATUS"
            exit 1
          fi
          echo "Connectors guard OK: 401"

      - name: Cleanup
        if: always()
        run: docker rm -f mc-e2e || true

      - name: Remove this run's images
        if: always()
        run: |
          # Per-run tags (unique per run id + attempt) built above; only these two
          # images are removed - no global prune on the shared self-hosted host.
          e2e="model-connector-e2e:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rate_limit="model-connector-rate-limit-test:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "=== images before removal ==="
          docker image ls --filter "reference=$e2e" --filter "reference=$rate_limit" || true
          docker image rm -f "$e2e" || true
          docker image rm -f "$rate_limit" || true
          echo "=== images after removal (expect none) ==="
          docker image ls --filter "reference=$e2e" --filter "reference=$rate_limit" || true
          # Proof the step exists for: fail only if a per-run image is still present.
          left="$(docker image ls -q --filter "reference=$e2e" --filter "reference=$rate_limit" 2>/dev/null || true)"
          if [ -n "$left" ]; then
            echo "ERROR: per-run images still present after removal: $left" >&2
            exit 1
          fi
          echo "per-run images removed: none left"

  # ARC-CI digest-promotion gap fill (Muneral 440d2499): build once to GHCR and
  # emit published-image.json. Does not change the existing push-main broker
  # deploy job below; production cutover by digest remains a later host-gated
  # step (compose-broker has no REGISTRY_AUTH row for model-connector today).
  publish-image:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [lint-and-test, docker-e2e]
    runs-on: [self-hosted, Linux, ci-general]
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    concurrency:
      group: publish-model-connector
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish exact image
        id: publish
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          build-args: |
            MC_BUILD_SHA=${{ github.sha }}
          tags: ghcr.io/arcanada-one/model-connector:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            io.arcanada.release_sha=${{ github.sha }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Record immutable publication identity
        env:
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "${IMAGE_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]
          jq -n --arg release "${RELEASE_SHA}" --arg digest "${IMAGE_DIGEST}" \
            '{schema_version: 1, release_sha: $release, image_digest: $digest}' \
            > published-image.json
          {
            printf 'release_sha=%s\n' "${RELEASE_SHA}"
            printf 'image=ghcr.io/arcanada-one/model-connector@%s\n' "${IMAGE_DIGEST}"
          } >> "${GITHUB_STEP_SUMMARY}"
      - name: Upload immutable publication identity
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: model-connector-image-${{ github.sha }}
          path: published-image.json
          if-no-files-found: error
          retention-days: 7

  verify-published-image:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [publish-image]
    runs-on: [self-hosted, Linux, ci-general]
    permissions:
      packages: read
    concurrency:
      group: verify-published-model-connector
      cancel-in-progress: false
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull and verify exact registry artifact
        env:
          IMAGE_DIGEST: ${{ needs.publish-image.outputs.digest }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "${IMAGE_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]
          image="ghcr.io/arcanada-one/model-connector@${IMAGE_DIGEST}"
          docker pull "${image}"
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "${image}")" = "${RELEASE_SHA}"
          test "$(docker image inspect --format '{{ index .Config.Labels "io.arcanada.release_sha" }}' "${image}")" = "${RELEASE_SHA}"
          printf 'published image verification: PASS\n'

  deploy:
    needs: lint-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    # INFRA-0417 / SEC-0063. This job used to be an `appleboy/ssh-action` step
    # holding an SSH private key, connecting to a host named by the DEPLOY_HOST
    # secret, and executing forty lines of deploy logic inlined into a YAML
    # string. Three problems, independent of which machine it pointed at:
    #
    #   * The deploy target was invisible. Nothing in this file said which
    #     machine would be changed, so it could not be reviewed and could not
    #     be moved without editing a secret. SEC-0063 exists because of exactly
    #     this: the host is chosen by a runner label, never by an address in
    #     config. The consolidation of three machines made it concrete — there
    #     was no way to tell from the repository where this deploy landed.
    #   * The deploy logic was not in the repository, so it was not lintable,
    #     not testable and not diffable as code. It now lives in
    #     deploy/deploy.sh, unchanged in behaviour.
    #   * The job held shell access to production as a long-lived key.
    #
    # The label is host-unique (exactly one holder), unlike the shared
    # `arcana-prod` that several runners on different machines advertise.
    runs-on: [self-hosted, linux, arcana-prd-host]
    concurrency:
      group: deploy-model-connector
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/ci

      - name: Runner broker preflight (A2-457)
        run: scripts/ci/runner-broker-preflight.sh
        env: { BROKER_PREFLIGHT_BIN: /usr/local/sbin/arcanada-compose-broker }

      - name: Sync broker checkout to this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" |
            sudo -n /usr/local/sbin/arcanada-compose-broker model-connector sync "$GITHUB_SHA"

      - name: Deploy (build, migrate, assert)
        run: sudo -n /usr/local/sbin/arcanada-compose-broker model-connector run-deploy

      - name: Status snapshot
        run: sudo -n /usr/local/sbin/arcanada-compose-broker model-connector ps

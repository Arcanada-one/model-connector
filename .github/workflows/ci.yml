name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: [self-hosted, Linux, ci-general]
    steps:
      - uses: actions/checkout@v7

      - name: Credential documentation regression
        run: bash dev-tools/credential-docs-regression.sh

      # ARAS-0058 — BILLING_ENFORCED was declared nowhere outside src/: not in
      # .env.example, not in docker-compose.yml, not in deploy/, not here. It
      # was set by hand on the prod container, so the next deploy that rebuilt
      # the env from the template would have silently disabled billing — and
      # the failure mode is SUCCESSFUL FREE SERVICE, which nothing alerts on.
      # This fails the PR that drops the declaration.
      - name: Env declaration parity
        run: |
          bash -n dev-tools/env-declaration-parity.sh
          bash dev-tools/env-declaration-parity.sh

      - name: Fixed aggregate readback broker contract
        run: |
          bash -n deploy/arcanada-compose-broker.sh
          bash -n deploy/arcanada-compose-broker.test.sh
          bash deploy/arcanada-compose-broker.test.sh
      # INFRA-0462 — watcher/test/*.bats existed from the day the watcher landed
      # and no step ever ran them. Specs nothing invokes are the same shape as
      # the defect this PR fixes: a check that cannot fail. shellcheck runs over
      # the deploy scripts here for the same reason -- they are shipped code that
      # runs as root on a timer, and nothing was reading them.
      #
      # Both tools are present system-wide on the ci-general pool (verified in a
      # non-login shell as each runner user, which is how a step actually sees
      # PATH). A missing tool fails the step loudly rather than skipping: a
      # fail-soft skip here would hide exactly the class of defect below.
      - name: Watcher deploy scripts and specs
        run: |
          command -v shellcheck >/dev/null || { echo "shellcheck missing on this runner"; exit 1; }
          command -v bats >/dev/null || { echo "bats missing on this runner"; exit 1; }
          shellcheck -S warning watcher/deploy/*.sh watcher/scripts/*.sh
          # Named, not `bats watcher/test/`: classification.bats needs a built
          # watcher/dist that no CI step produces, so sweeping the directory
          # would wire in a step that is red on arrival -- and a step that is
          # always red is a step everybody learns to skip. Tracked as its own
          # task (INFRA-0471) rather than silenced with a skip here.
          bats watcher/test/health-selfcheck.bats

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm db:generate
        env:
          DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

  docker-e2e:
    runs-on: [self-hosted, Linux, ci-general]
    needs: lint-and-test
    concurrency:
      group: docker-e2e-arcana-prod
      cancel-in-progress: false
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: connector_test
        ports:
          - 15432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 16379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build -t model-connector-e2e .

      - name: Create DB schema
        run: |
          docker run --rm --network=host \
            -e DATABASE_URL=postgresql://test:test@localhost:15432/connector_test \
            model-connector-e2e npx prisma migrate deploy

      - name: Verify first-dispatch PostgreSQL invariants
        run: |
          docker run --rm --network=host --entrypoint node \
            -e DATABASE_URL=postgresql://test:test@localhost:15432/connector_test \
            -v "$PWD/dev-tools/first-dispatch-observation-db-contract.mjs:/app/first-dispatch-observation-db-contract.mjs:ro" \
            model-connector-e2e /app/first-dispatch-observation-db-contract.mjs

      - name: Start container
        run: |
          docker run -d --name mc-e2e --network=host \
            -e DATABASE_URL=postgresql://test:test@localhost:15432/connector_test \
            -e REDIS_HOST=localhost \
            -e REDIS_PORT=16379 \
            -e NODE_ENV=test \
            -e PORT=3900 \
            -e STT_PROVIDER_GROQ_ENABLED=false \
            model-connector-e2e
          # STT_PROVIDER_GROQ_ENABLED defaults true (env.schema), which makes the
          # boot-time env validation require STT_GROQ_API_KEY. The e2e harness does
          # not exercise STT and injects no provider key, so disable the Groq STT
          # provider here. Prod is unaffected (its .env supplies GROQ_API_KEY).

      - name: Wait for healthy
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3900/health > /dev/null 2>&1; then
              echo "Health check passed on attempt $i"
              exit 0
            fi
            sleep 2
          done
          echo "Health check failed after 60s"
          docker logs mc-e2e
          exit 1

      - name: Smoke tests
        run: |
          echo "=== GET /health ==="
          curl -fsS http://localhost:3900/health | jq .

          echo "=== GET /health/ready ==="
          curl -fsS http://localhost:3900/health/ready | jq .

          echo "=== POST /execute without auth → expect 401 ==="
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:3900/execute \
            -H 'Content-Type: application/json' \
            -d '{"connector":"claude-code","prompt":"test"}')
          if [ "$STATUS" != "401" ]; then
            echo "Expected 401, got $STATUS"
            exit 1
          fi
          echo "Auth guard OK: 401"

          echo "=== GET /connectors → expect 401 ==="
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3900/connectors)
          if [ "$STATUS" != "401" ]; then
            echo "Expected 401, got $STATUS"
            exit 1
          fi
          echo "Connectors guard OK: 401"

      - name: Cleanup
        if: always()
        run: docker rm -f mc-e2e || true

  deploy:
    needs: lint-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: [self-hosted, Linux, arcana-prod]
    concurrency:
      group: deploy-model-connector
      cancel-in-progress: false
    steps:
      - name: Deploy to Arcanada PROD
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd /srv/apps/model-connector
            git pull --ff-only origin main
            # INFRA-0280 moved Redis from Arcana-KB to Arcana-DBS. Migrate only
            # the known stale endpoint and preserve every secret in the env file.
            if grep -qx 'REDIS_HOST=100.70.137.104' .env; then
              sed -i 's/^REDIS_HOST=100\.70\.137\.104$/REDIS_HOST=100.97.136.74/' .env
            fi
            grep -qx 'REDIS_HOST=100.97.136.74' .env \
              || (echo 'FAIL: REDIS_HOST does not point to Arcana-DBS'; exit 1)
            # CONN-0073: layer codex overlay so codex env (CODEX_BINARY_PATH,
            # CODEX_HOME, CODEX_VAULT_ROLE_ID, CODEX_VAULT_SECRET_ID) and
            # codex-bin/dev-shm volumes are applied to model-connector container
            # alongside the codex-sidecar service.
            COMPOSE="docker compose -f docker-compose.yml -f docker-compose.codex.yml"
            # CONN-0208: cleanup orphan containers before recreate (race condition); named volumes preserved.
            $COMPOSE down --remove-orphans || true
            $COMPOSE up -d --build
            sleep 10
            curl -fsS http://localhost:3900/health || ($COMPOSE logs --tail=50 && exit 1)
            # ARAS-0071: apply schema migrations. Without this a schema change
            # deploys as CODE WITHOUT SCHEMA — which is exactly what happened to
            # the credits tables: they were created in test databases by
            # `prisma db push` (which writes no migration file), so every suite
            # was green while production had no tables at all. The failure was
            # silent, because the settle path is non-fatal by design and simply
            # logged. Running it AFTER the health check keeps the ordering
            # honest: the container is already up and serving, so a migration
            # failure is a loud deploy failure rather than a boot loop.
            docker exec model-connector-model-connector-1 \
              npx prisma migrate deploy \
              || (echo "FAIL: prisma migrate deploy"; exit 1)
            docker exec model-connector-model-connector-1 sh -c \
              'test -n "$CODEX_BINARY_PATH" && test -n "$CODEX_HOME" && test -n "$CODEX_VAULT_ROLE_ID" && test -n "$CODEX_VAULT_SECRET_ID"' \
              || (echo "FAIL CONN-0073: codex overlay env not applied"; exit 1)
            # ARAS-0058: assert the billing switch actually reached the running
            # container. It used to be set by hand and declared nowhere, so a
            # rebuild of .env from the template would drop it — and the symptom
            # of dropping it is that everything keeps working, for free. This is
            # deliberately fatal rather than a warning: a warning in a deploy log
            # is indistinguishable from the silence it is meant to replace.
            docker exec model-connector-model-connector-1 sh -c \
              'test -n "$BILLING_ENFORCED"' \
              || (echo "FAIL ARAS-0058: BILLING_ENFORCED is not set in the container env."; \
                  echo "  Add an explicit BILLING_ENFORCED=<true|false> line to"; \
                  echo "  /srv/apps/model-connector/.env — the schema default (false) means"; \
                  echo "  an absent value disables billing SILENTLY, which is the exact"; \
                  echo "  failure this check exists to make loud."; exit 1)
            echo "ARAS-0058: BILLING_ENFORCED=$(docker exec model-connector-model-connector-1 printenv BILLING_ENFORCED)"
            echo "Deploy successful: $($COMPOSE ps --format '{{.Name}} {{.Status}}')"

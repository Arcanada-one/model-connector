name: Deploy STT Whisper

on:
  push:
    branches: [main]
    paths:
      - 'deploy/stt-whisper/**'
      - '.github/workflows/deploy-stt-whisper.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  network-exposure-lint:
    # Mandate: CI/CD Convention #5 — network-exposure-lint must gate any
    # deploy of a stack with new listeners. Tier 2 stack is loopback + tailnet,
    # but the lint enforces the absence of public `0.0.0.0` binds.
    # `datarim_ref` is a required input of the reusable workflow and was not
    # passed, so the call failed at workflow-startup: the whole run ended as
    # `startup_failure` with no jobs, and the broker path this workflow exists
    # to exercise has therefore never executed once. Pinning to an exact commit
    # is also what the linter's own guard demands.
    uses: Arcanada-one/datarim/.github/workflows/network-exposure-lint.yml@6531b66436b6a735be41a2288082d6de09df3bfa
    with:
      compose_paths: 'deploy/stt-whisper/docker-compose.yml'
      datarim_ref: '57afdfcd6a2d71aa8e0b577de6e43846e93b60dd'

  deploy:
    needs: network-exposure-lint
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    # INFRA-0417: host-unique label instead of the shared `arcana-prod`, which
    # several runners on different machines advertise — a deploy landing on the
    # wrong one would start a second, empty whisper stack and report success.
    runs-on: [self-hosted, linux, arcana-prd-host]
    concurrency:
      group: deploy-stt-whisper
      cancel-in-progress: false
    env:
      COMPOSE_FILE: deploy/stt-whisper/docker-compose.yml
      # INFRA-0417: the health probe used to name the tailnet IP of one machine
      # (100.121.155.54 = arcana-prod, being decommissioned). The check runs ON
      # the deploy host, so loopback is host-independent.
      #
      # The port is read from the same root-owned env file the stack itself
      # uses, rather than repeated here: arcana-prd already publishes another
      # service on 8400, so the stack moved to a different port there, and a
      # second literal would have gone on probing a port nothing serves — a
      # deploy that fails with the service perfectly healthy, or worse, one
      # that passes against somebody else's endpoint.
      # (no port literal here: it is read from the running stack, below)
    steps:
      - uses: actions/checkout@v7

      # INFRA-0121 mandate: pre-deploy preflight against the target host.
      # SHA-bridge per CLAUDE.md § 8 — INFRA-0122 PR #8 head until merge tag v1.x.y lands.
      - name: Preflight check
        uses: Arcanada-one/datarim/.github/actions/preflight-check@fff25210a90204db04962dc2de63fe255a084ec3 # v1 SHA-bridge (INFRA-0122 PR #8 head)
        with:
          # A logical name for metric keys and Ops Bot metadata, not a
          # connection target: the checks run locally on the runner.
          target-host: arcana-prd
          service-name: stt-whisper
          # STT model needs ~3.25 GiB at peak; the host has ample headroom.
          min-free-disk-gb: '5'
          disk-warn-percent: '80'
          disk-fail-percent: '90'
          extra-checks: |
            tailscale
            docker-pressure
            ram-swap
            loadavg
            time-skew
          ops-bot-emit: 'true'
          ops-bot-key: ${{ secrets.OPS_BOT_API_KEY }}

      # These were a single plain YAML scalar, which folds into one line: the
      # `pull` invocation became trailing arguments to `sync`, and the broker
      # correctly rejected it as `sync takes exactly one sha`.
      - name: Sync broker checkout to this commit
        run: sudo -n /usr/local/sbin/arcanada-compose-broker stt-whisper sync "$GITHUB_SHA"

      - name: Pull pinned image
        run: sudo -n /usr/local/sbin/arcanada-compose-broker stt-whisper pull

      - name: Bring up stack
        run: sudo -n /usr/local/sbin/arcanada-compose-broker stt-whisper up

      - name: Resolve the port the stack actually published
        run: |
          set -euo pipefail
          # Read it from the running stack rather than repeating a literal.
          # `ps` reports the published mapping the broker's own compose
          # invocation produced, so the probe cannot drift from the deploy:
          # a port taken from the workflow could go on checking 8400 while the
          # stack moved, which fails a deploy whose service is perfectly
          # healthy — or passes against whatever else now answers there.
          # The ADDRESS matters as much as the port. This stack publishes on
          # the host's tailnet interface only — deliberately, it is the Tier 2
          # exposure baseline — so 127.0.0.1 is not merely a different route to
          # the same socket, it is a socket that does not exist. Probing it
          # would fail a deploy whose service is healthy, which is exactly what
          # happened when this was first written against loopback.
          mapping="$(sudo -n /usr/local/sbin/arcanada-compose-broker \
            stt-whisper ps 2>/dev/null |
            grep -oE '[0-9.]+:[0-9]+->8000/tcp' | head -1)"
          published="${mapping%%->*}"
          [[ "${published}" =~ ^[0-9.]+:[0-9]{1,5}$ ]] || {
            echo "could not determine the published whisper endpoint" >&2
            exit 1
          }
          echo "WHISPER_HEALTH_URL=http://${published}/health" >> "$GITHUB_ENV"

      - name: Wait for healthy
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "$WHISPER_HEALTH_URL" > /dev/null 2>&1; then
              echo "Whisper healthy on attempt $i"
              exit 0
            fi
            sleep 5
          done
          echo "Health check failed after 150s"
          sudo -n /usr/local/sbin/arcanada-compose-broker stt-whisper logs 100
          exit 1

      - name: Post-deploy health body assertion
        run: |
          BODY=$(curl -fsS "$WHISPER_HEALTH_URL")
          echo "Health body: $BODY"
          if ! echo "$BODY" | grep -qi 'ok\|healthy'; then
            echo "Unexpected health body (expected ok|healthy)"
            exit 1
          fi

      - name: Status snapshot
        run: sudo -n /usr/local/sbin/arcanada-compose-broker stt-whisper ps

      - name: Notify Ops Bot on failure
        if: failure()
        env:
          OPS_BOT_API_KEY: ${{ secrets.OPS_BOT_API_KEY }}
        run: |
          if [ -z "${OPS_BOT_API_KEY:-}" ]; then
            echo "OPS_BOT_API_KEY missing — skipping Ops Bot notification (fail-soft per Authenticated-emit pattern)"
            exit 0
          fi
          curl -fsS -X POST https://ops.arcanada.ai/events \
            -H "Authorization: Bearer $OPS_BOT_API_KEY" \
            -H 'Content-Type: application/json' \
            -d "$(jq -nc \
              --arg service stt-whisper \
              `# INFRA-0417: read the host from the machine rather than hard-coding` \
              `# it. A literal here survives a move and then reports the failure` \
              `# against a machine that no longer runs the service.` \
              --arg host "$(hostname -s)" \
              --arg run "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              '{category:"fatal", agent:"deploy-stt-whisper", service:$service, host:$host, body:"deploy-stt-whisper failed", meta:{run_url:$run}, dedup_key:("deploy-stt-whisper-" + $host + "-failed")}')" \
            || echo "Ops Bot notify failed (continuing — deploy already failed)"

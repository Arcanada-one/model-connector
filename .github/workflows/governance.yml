name: governance

# Fails any PR that touches a governance path (.github/workflows, CODEOWNERS,
# branch-protection config, credential/execution boundary) unless the PR body
# carries: GOVERNANCE-CHANGE: <at least 20 characters of reason>.
#
# Pinned by commit SHA, not a moving ref, so the guard cannot change under us.

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  governance:
    name: governance-diff-guard
    runs-on: [ci-nodocker]
    steps:
      - uses: Arcanada-one/shared-workflows/.github/actions/governance-diff-guard@11cbbf2e5235ddc322b8f344836ea6ed4c67b0a2

# Measurement only. Never merge. No registry login, no push, no secrets, no GitHub Actions cache access.
# Arm B = no cache export. Arm C = type=local cache, mode=min, inside the job temp dir, removed at the end.
# Arm A (type=gha) is deliberately not replayed here: the repository cache has no free headroom.
name: Cache export measurement (do not merge)

on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/mc-cache-measure.yml']

permissions:
  contents: read

concurrency:
  group: mc-cache-measure
  cancel-in-progress: false

jobs:
  measure:
    if: github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'arcana-swe/mc-cache-')
    runs-on: [self-hosted, Linux, ci-general]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: f5d5d6f6577c72bb9a13303abcbaab52f03e04b6
          persist-credentials: false
      - name: Measure arms B and C, then negative controls
        timeout-minutes: 50
        run: |
          cat > "${RUNNER_TEMP}/measure.py" <<'PY'
          import hashlib, json, os, re, shutil, subprocess, tarfile, time

          SHA = "f5d5d6f6577c72bb9a13303abcbaab52f03e04b6"
          NEXT = "1" * 40  # synthetic "next commit": same context, different MC_BUILD_SHA
          RUN = os.environ["GITHUB_RUN_ID"] + "-" + os.environ["GITHUB_RUN_ATTEMPT"]
          W = os.path.join(os.environ["RUNNER_TEMP"], "mc-cache-" + RUN)
          SRC = os.getcwd()
          os.makedirs(W)
          results, controls = [], []

          def out(tag, obj):
              print(tag + " " + json.dumps(obj, sort_keys=True), flush=True)

          def sh(*a):
              return subprocess.run(a, capture_output=True, text=True).stdout.strip()

          def du(path):
              return sum(os.path.getsize(os.path.join(d, f)) for d, _, fs in os.walk(path) for f in fs)

          def verify(tar, want_digest, want_sha, marker=None):
              """Return a list of problems; empty means the OCI archive is self-consistent."""
              bad = []
              x = tar + ".d"
              os.makedirs(x)
              try:
                  with tarfile.open(tar) as t:
                      t.extractall(x, filter="data") if hasattr(tarfile, "data_filter") else t.extractall(x)
                  blobs = os.path.join(x, "blobs", "sha256")
                  for name in os.listdir(blobs):
                      h = hashlib.sha256()
                      with open(os.path.join(blobs, name), "rb") as f:
                          for chunk in iter(lambda: f.read(1 << 20), b""):
                              h.update(chunk)
                      if h.hexdigest() != name:
                          bad.append("blob-hash-mismatch:" + name[:12])
                  def load(d):
                      with open(os.path.join(blobs, d.split(":")[1])) as f:
                          return json.load(f)
                  top = json.load(open(os.path.join(x, "index.json")))["manifests"][0]["digest"]
                  if top != want_digest:
                      bad.append("digest-mismatch")
                  index = load(top)
                  images = [m for m in index["manifests"] if m.get("platform", {}).get("os") == "linux"]
                  atts = [m for m in index["manifests"] if "vnd.docker.reference.type" in m.get("annotations", {})]
                  preds = [l.get("annotations", {}).get("in-toto.io/predicate-type", "")
                           for a in atts for l in load(a["digest"])["layers"]]
                  if not any("slsa.dev/provenance" in p for p in preds):
                      bad.append("no-provenance")
                  if not any("spdx" in p for p in preds):
                      bad.append("no-sbom")
                  image = load(images[0]["digest"])
                  for desc in [image["config"]] + image["layers"]:
                      if not os.path.exists(os.path.join(blobs, desc["digest"].split(":")[1])):
                          bad.append("missing-blob:" + desc["digest"][7:19])
                  cfg = load(image["config"]["digest"])["config"]
                  if cfg.get("Labels", {}).get("org.opencontainers.image.revision") != want_sha:
                      bad.append("wrong-revision-label")
                  if "MC_BUILD_SHA=" + want_sha not in cfg.get("Env", []):
                      bad.append("wrong-build-sha-env")
                  if marker:
                      found = False
                      for desc in image["layers"]:
                          with tarfile.open(os.path.join(blobs, desc["digest"].split(":")[1])) as lt:
                              for m in lt:
                                  if m.name.endswith("app/scripts/mc-cache-stale-marker.txt"):
                                      found = lt.extractfile(m).read().decode().strip() == marker
                      if not found:
                          bad.append("new-source-not-in-image")
              except Exception as e:
                  bad.append("verify-error:" + type(e).__name__)
              finally:
                  shutil.rmtree(x, ignore_errors=True)
              return bad

          def build(label, sha, cache_from=None, cache_to=None, context=SRC, dockerfile=None, keep=False, marker=None):
              name = "mcx-" + RUN + "-" + label.lower()
              tar, meta = os.path.join(W, label + ".tar"), os.path.join(W, label + ".json")
              rec = {"label": label, "load_before": os.getloadavg()[0],
                     "buildkit_containers_before": len(sh("docker", "ps", "-q", "--filter", "name=buildx_buildkit_").split()),
                     "utc_start": time.strftime("%H:%M:%S", time.gmtime())}
              t0 = time.monotonic()
              subprocess.run(["docker", "buildx", "create", "--name", name, "--driver", "docker-container",
                              "--driver-opt", "image=moby/buildkit:v0.35.1", "--bootstrap"], check=True,
                             capture_output=True)
              rec["builder_boot_s"] = round(time.monotonic() - t0, 1)
              try:
                  cmd = ["docker", "buildx", "build", "--builder", name, "--progress", "plain",
                         "--build-arg", "MC_BUILD_SHA=" + sha,
                         "--label", "org.opencontainers.image.revision=" + sha,
                         "--label", "io.arcanada.release_sha=" + sha,
                         "--attest", "type=provenance,builder-id=urn:mc-cache-measure",
                         "--attest", "type=sbom,disabled=false",
                         "--output", "type=oci,dest=" + tar + ",name=localhost/mc-cache-measure:" + label.lower(),
                         "--metadata-file", meta]
                  if cache_from:
                      cmd += ["--cache-from", "type=local,src=" + cache_from]
                  if cache_to:
                      cmd += ["--cache-to", "type=local,mode=min,dest=" + cache_to]
                  if dockerfile:
                      cmd += ["-f", dockerfile]
                  cmd += [context]
                  t0 = time.monotonic()
                  p = subprocess.Popen(cmd, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True, errors="replace")
                  lines = []
                  for line in p.stdout:
                      lines.append(line.rstrip("\n"))
                      print(label + "| " + line.rstrip("\n")[:240], flush=True)
                  rec["exit"] = p.wait()
                  rec["wall_s"] = round(time.monotonic() - t0, 1)
                  steps, cached, done, title = {}, set(), {}, {}
                  for l in lines:
                      m = re.match(r"#(\d+) \[((?:base|deps|build|production) +\d+/\d+)\]", l)
                      if m:
                          steps[m[1]] = re.sub(" +", " ", m[2])
                      m = re.match(r"#(\d+) (exporting cache.*|importing cache.*|exporting to .*)$", l)
                      if m:
                          title.setdefault(m[1], m[2])
                      m = re.match(r"#(\d+) CACHED", l)
                      if m:
                          cached.add(m[1])
                      m = re.match(r"#(\d+) DONE ([\d.]+)s", l)
                      if m:
                          done[m[1]] = max(done.get(m[1], 0), float(m[2]))
                  all_steps = set(steps.values())
                  hit = sorted({steps[i] for i in cached if i in steps})
                  rec["steps"], rec["cached"], rec["cached_steps"] = len(all_steps), len(hit), hit
                  rec["step_s"] = {steps[i]: done[i] for i in steps if i in done}
                  rec["export_cache_s"] = sum(done.get(i, 0) for i, t in title.items() if t.startswith("exporting cache"))
                  rec["import_cache_s"] = sum(done.get(i, 0) for i, t in title.items() if t.startswith("importing cache"))
                  rec["export_image_s"] = sum(done.get(i, 0) for i, t in title.items() if t.startswith("exporting to "))
                  rec["cache_bytes"] = du(cache_to) if cache_to and os.path.isdir(cache_to) else 0
                  rec["errors"] = [l[:200] for l in lines if re.search(r"(?i)\berror\b|failed to", l)
                                   and re.search(r"(?i)cache|digest|failed to solve|ERROR:", l)][:4]
                  if rec["exit"] == 0:
                      rec["digest"] = json.load(open(meta))["containerimage.digest"]
                      rec["image_tar_bytes"] = os.path.getsize(tar)
                      rec["verify_problems"] = verify(tar, rec["digest"], sha, marker)
              finally:
                  subprocess.run(["docker", "buildx", "rm", "--force", name], capture_output=True)
                  if not keep and os.path.exists(tar):
                      os.remove(tar)
              out("RESULT", rec)
              return rec

          def control(cid, expected, observed, ok):
              c = {"control": cid, "expected": expected, "observed": observed, "verdict": "PASS" if ok else "FAIL"}
              controls.append(c)
              out("CONTROL", c)

          try:
              free = shutil.disk_usage(W).free
              out("HOST", {"cpus": os.cpu_count(), "load": os.getloadavg(), "free_gb": free // 10**9,
                           "buildx": sh("docker", "buildx", "version")})
              if free < 25 * 10**9:
                  raise SystemExit("BLOCKED: less than 25 GB free in runner temp")
              c1, c2, c3 = (os.path.join(W, n) for n in ("c1", "c2", "c3"))
              # Interleaved so that host drift hits both arms alike.
              results.append(build("B1", SHA))
              results.append(build("C1", SHA, cache_to=c1))
              results.append(build("B2", NEXT))
              results.append(build("C2", NEXT, cache_from=c1, cache_to=c2))
              results.append(build("B3", NEXT))
              results.append(build("C3", NEXT, cache_from=c2, cache_to=c3, keep=True))
              for d in (c2, c3):
                  shutil.rmtree(d, ignore_errors=True)

              # N3b: the verifier itself must reject a wrong expected digest and a tampered blob.
              good = os.path.join(W, "C3.tar")
              c3rec = results[-1]
              if c3rec["exit"] == 0:
                  p1 = verify(good, "sha256:" + "0" * 64, NEXT)
                  control("N3b-wrong-expected-digest", "verifier rejects", p1, "digest-mismatch" in p1)
                  tam = os.path.join(W, "tampered.tar")
                  x = os.path.join(W, "tam")
                  with tarfile.open(good) as t:
                      t.extractall(x)
                  bd = os.path.join(x, "blobs", "sha256")
                  big = max(os.listdir(bd), key=lambda n: os.path.getsize(os.path.join(bd, n)))
                  os.chmod(os.path.join(bd, big), 0o644)
                  with open(os.path.join(bd, big), "r+b") as f:
                      f.seek(100)
                      b = f.read(1)
                      f.seek(100)
                      f.write(bytes([b[0] ^ 255]))
                  with tarfile.open(tam, "w") as t:
                      for n in os.listdir(x):
                          t.add(os.path.join(x, n), arcname=n)
                  p2 = verify(tam, c3rec["digest"], NEXT)
                  control("N3b-tampered-blob", "verifier rejects", p2, any(s.startswith("blob-hash-mismatch") for s in p2))
                  shutil.rmtree(x)
                  os.remove(tam)
                  os.remove(good)

              # N1: stale cache + changed source must rebuild and ship the new source.
              stale = os.path.join(W, "stale-src")
              shutil.copytree(SRC, stale, ignore=shutil.ignore_patterns(".git"), symlinks=True)
              marker = "stale-control-" + RUN
              open(os.path.join(stale, "scripts", "mc-cache-stale-marker.txt"), "w").write(marker + "\n")
              r = build("N1", NEXT, cache_from=c1, context=stale, marker=marker)
              control("N1-stale-cache", "build succeeds, changed COPY step not cached, new source in image",
                      {"exit": r["exit"], "cached": r["cached_steps"], "problems": r.get("verify_problems")},
                      r["exit"] == 0 and r.get("verify_problems") == [] and "production 9/12" not in r["cached_steps"])

              # N2a: cache directory that does not exist.
              r = build("N2A", SHA, cache_from=os.path.join(W, "does-not-exist"))
              control("N2a-unreadable-cache", "fails closed OR rebuilds with zero hits and a verified image",
                      {"exit": r["exit"], "cached": r["cached"], "problems": r.get("verify_problems")},
                      r["exit"] != 0 or (r["cached"] == 0 and r.get("verify_problems") == []))

              # N2b: same manifests, every large blob corrupted. Same SHA, so cache keys match.
              corrupt = os.path.join(W, "corrupt")
              shutil.copytree(c1, corrupt)
              bd = os.path.join(corrupt, "blobs", "sha256")
              n = 0
              for name in os.listdir(bd):
                  path = os.path.join(bd, name)
                  if os.path.getsize(path) > 65536:
                      os.chmod(path, 0o644)
                      with open(path, "r+b") as f:
                          f.seek(os.path.getsize(path) // 2)
                          f.write(os.urandom(4096))
                      n += 1
              out("CORRUPTED", {"blobs": n})
              r = build("N2B", SHA, cache_from=corrupt)
              control("N2b-corrupt-cache-blobs", "fails closed OR output passes full blob verification",
                      {"exit": r["exit"], "cached": r["cached_steps"], "corrupted": n,
                       "problems": r.get("verify_problems"), "errors": r["errors"]},
                      n > 0 and (r["exit"] != 0 or r.get("verify_problems") == []))

              # N3a: wrong base-image digest must fail the build.
              df = os.path.join(W, "Dockerfile.wrongdigest")
              text = open(os.path.join(SRC, "Dockerfile")).read()
              wrong = re.sub(r"(FROM node:[^@]+@sha256:)[0-9a-f]{64}", lambda m: m[1] + "0" * 64, text)
              assert wrong != text
              open(df, "w").write(wrong)
              r = build("N3A", SHA, cache_from=c1, dockerfile=df)
              control("N3a-wrong-base-digest", "build fails, no image", {"exit": r["exit"], "errors": r["errors"]},
                      r["exit"] != 0 and "digest" not in r)
          finally:
              out("SUMMARY", {"results": [{k: v for k, v in r.items() if k not in ("step_s",)} for r in results],
                              "controls": controls, "load_end": os.getloadavg()})
              shutil.rmtree(W, ignore_errors=True)
              out("CLEANUP", {"work_dir_removed": not os.path.exists(W)})
          bad = [r["label"] for r in results if r["exit"] != 0 or r.get("verify_problems")]
          if bad or any(c["verdict"] != "PASS" for c in controls):
              raise SystemExit("measurement has failures: " + json.dumps(bad))
          PY
          nice -n 10 python3 -B "${RUNNER_TEMP}/measure.py"
      - name: Remove job-local measurement data and builders
        if: always()
        run: |
          for b in $(docker buildx ls --format '{{.Name}}' | grep -E "^mcx-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-[a-z0-9]+$" || true); do
            docker buildx rm --force "$b" || true
          done
          rm -rf "${RUNNER_TEMP}/mc-cache-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" "${RUNNER_TEMP}/measure.py"

name: public-surface

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Keep the canonical Datarim implementation; only orchestration is local so
# this consumer can select the available Docker-free runner. Preserve the
# reusable workflow's native check name and resolved inputs.
jobs:
  public-surface:
    name: public-surface / public-surface-lint
    runs-on: [ci-nodocker]
    steps:
      - name: Checkout target repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout Datarim linter
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Arcanada-one/datarim
          ref: 8bc53db69b824ef9342613ef4f2c8b1cf6d6e23f
          path: .datarim
          persist-credentials: false

      - name: Resolve regex file
        id: regex
        env:
          CONSUMER_REGEX: 'dev-tools/public-surface-forbidden.regex'
        run: |
          set -euo pipefail
          if [ -n "$CONSUMER_REGEX" ] && [ -f "$CONSUMER_REGEX" ]; then
            echo "path=$CONSUMER_REGEX" >> "$GITHUB_OUTPUT"
          else
            echo "path=.datarim/dev-tools/public-surface-forbidden.regex" >> "$GITHUB_OUTPUT"
          fi

      - name: Run public-surface lint
        env:
          PATHS_INPUT: 'README.md CHANGELOG.md docs packages'
          REGEX_PATH: ${{ steps.regex.outputs.path }}
          REPORT: 'true'
        run: |
          set -uo pipefail
          args=(--regex "$REGEX_PATH" --paths)
          for p in $PATHS_INPUT; do [ -n "$p" ] && args+=("$p"); done
          [ "$REPORT" = "true" ] && args+=(--report)
          ./.datarim/dev-tools/public-surface-lint.sh "${args[@]}"

name: Publish SDKs

on:
  push:
    tags:
      - 'sdk-v*'
  pull_request:
    paths:
      - 'packages/sdk-ts/**'
      - 'packages/sdk-python/**'
      - '.github/workflows/publish-sdks.yml'

concurrency:
  group: publish-sdk
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Build, dry-run, and npm publish stay on self-hosted runners. Operator
  # decision 2026-11-18: npm Trusted Publishing / OIDC is accepted only from
  # GitHub-hosted runners, so publish-ts authenticates with secrets.NPM_TOKEN.
  # --provenance is not supported off GitHub-hosted and is omitted.
  build-ts:
    name: TypeScript — build + test + dry-run
    # Datarim fork deny: refuse untrusted fork PR code on org self-hosted runners.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, ci-general]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # `dest` is pinned per job on purpose. Several runners on a host share
      # one OS user, so the action default `~/setup-pnpm` is ONE directory that
      # concurrent jobs install pnpm into simultaneously and corrupt (A2-227).
      # `runner.temp` is per runner and per job. Do not drop this.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.23.4'
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile

      - name: Build SDK
        run: pnpm --filter @arcanada/model-connector-sdk build

      - name: Test SDK
        run: pnpm --filter @arcanada/model-connector-sdk test

      - name: Publish dry-run
        run: pnpm --filter @arcanada/model-connector-sdk publish --dry-run --no-git-checks

  publish-ts:
    name: TypeScript — publish to npm (NPM_TOKEN)
    needs: build-ts
    if: startsWith(github.ref, 'refs/tags/sdk-v')
    runs-on: [self-hosted, Linux, ci-general]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.23.4'
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile

      - name: Build SDK
        run: pnpm --filter @arcanada/model-connector-sdk build

      # NODE_AUTH_TOKEN via setup-node registry-url .npmrc; no --provenance off GH-hosted.
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          pnpm --filter @arcanada/model-connector-sdk publish \
            --access public \
            --no-git-checks

  build-python:
    name: Python — build + test + twine check
    # Datarim fork deny: refuse untrusted fork PR code on org self-hosted runners.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, ci-general]
    permissions:
      id-token: write
      contents: read
    environment:
      name: pypi-publish
      url: https://pypi.org/project/arcanada-model-connector/
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Install package + dev deps
        working-directory: packages/sdk-python
        run: pip install -e ".[dev]"

      - name: Run tests
        working-directory: packages/sdk-python
        run: pytest

      - name: Build sdist + wheel
        working-directory: packages/sdk-python
        run: python -m build

      - name: Twine check
        working-directory: packages/sdk-python
        run: twine check dist/*

      - name: Publish to PyPI
        if: startsWith(github.ref, 'refs/tags/sdk-v')
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: packages/sdk-python/dist/

name: Publish SDKs

on:
  push:
    tags:
      - 'sdk-v*'
  pull_request:
    paths:
      - 'packages/sdk-ts/**'
      - 'packages/sdk-python/**'
      - '.github/workflows/publish-sdks.yml'

concurrency:
  group: publish-sdk
  cancel-in-progress: false

jobs:
  # Build and test stay on the self-hosted runner. Only the publish step moves
  # to a GitHub-hosted runner, because that is the one thing that cannot run
  # here: self-hosted runners cannot obtain an OIDC token the npm registry
  # accepts, and OIDC is how we authenticate now that NPM_TOKEN is gone.
  build-ts:
    name: TypeScript — build + test + dry-run
    runs-on: [self-hosted, Linux, ci-general]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile

      - name: Build SDK
        run: pnpm --filter @arcanada/model-connector-sdk build

      - name: Test SDK
        run: pnpm --filter @arcanada/model-connector-sdk test

      - name: Publish dry-run
        run: pnpm --filter @arcanada/model-connector-sdk publish --dry-run --no-git-checks

  # Publishes via npm Trusted Publishing (OIDC) — no NPM_TOKEN anywhere.
  # The trust is registered on the package itself (npmjs.com -> package ->
  # Access -> Trusted Publisher) and is bound to THIS repo + THIS workflow
  # FILENAME, so renaming this file breaks publishing until the trust is
  # updated to match.
  #
  # Deliberately rebuilds rather than consuming an artifact from build-ts:
  # the tarball npm receives is then produced by the same job that publishes
  # it, on a runner whose provenance attestation actually describes it. Passing
  # a self-hosted build artifact through would make the attestation claim a
  # build environment that did not produce those bytes.
  publish-ts:
    name: TypeScript — publish to npm (OIDC)
    needs: build-ts
    if: startsWith(github.ref, 'refs/tags/sdk-v')
    runs-on: ubuntu-latest  # load-bearing: OIDC is unavailable on self-hosted
    permissions:
      id-token: write  # mints the OIDC token npm authenticates with
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          # >= 10.19 for OIDC. Pinned to 10.x rather than 11: pnpm 11 carried
          # an OIDC regression (pnpm#11513, fixed 2026-05-08) and a publish
          # path is a poor place to ride a fresh fix.
          version: 10.34.5

      - uses: actions/setup-node@v7
        with:
          node-version: '22.14'  # trusted publishing floor
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      # Node 22 ships npm 10.9.x; trusted publishing needs >= 11.5.1.
      - run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile

      - name: Build SDK
        run: pnpm --filter @arcanada/model-connector-sdk build

      # No --provenance: under trusted publishing npm generates and publishes
      # provenance attestations automatically. No NODE_AUTH_TOKEN: the OIDC
      # exchange IS the authentication.
      - name: Publish to npm
        run: |
          pnpm --filter @arcanada/model-connector-sdk publish \
            --access public \
            --no-git-checks

  build-python:
    name: Python — build + test + twine check
    runs-on: [self-hosted, Linux, X64]
    permissions:
      id-token: write
      contents: read
    environment:
      name: pypi-publish
      url: https://pypi.org/project/arcanada-model-connector/
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Install package + dev deps
        working-directory: packages/sdk-python
        run: pip install -e ".[dev]"

      - name: Run tests
        working-directory: packages/sdk-python
        run: pytest

      - name: Build sdist + wheel
        working-directory: packages/sdk-python
        run: python -m build

      - name: Twine check
        working-directory: packages/sdk-python
        run: twine check dist/*

      - name: Publish to PyPI
        if: startsWith(github.ref, 'refs/tags/sdk-v')
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/sdk-python/dist/
# connector.arcanada.ai — nginx reverse proxy vhost for Model Connector (:3900).
#
# SOURCE OF TRUTH. The live host copy is /etc/nginx/sites-available/connector.arcanada.ai.conf
# on arcana-prod (65.108.236.39). nginx is host-managed (not in the Docker deploy),
# so this file is the IaC mirror — edit HERE, then install per deploy/nginx/README.md.
#
# Rate limiting for Model Connector API.

server {
    listen 80;
    server_name connector.arcanada.ai;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name connector.arcanada.ai;

    ssl_certificate     /etc/nginx/ssl/wildcard.arcanada.ai.pem;
    ssl_certificate_key /etc/nginx/ssl/wildcard.arcanada.ai.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # MC requests can take up to 600s (Cursor CLI timeout)
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    client_max_body_size 32m;

    # ─────────────────────────────────────────────────────────────────────
    # SEC-0075 — close the double-encoding bypass BEFORE the denies below.
    #
    # Without this, `location /admin { deny all; }` below is bypassable. Verified
    # against this exact vhost and the real Nest/Fastify router:
    # `POST /%2561dmin/credits/abc/gift` was proxied and reached the gift handler.
    #
    # The mechanism is an asymmetry, not an nginx bug. nginx decodes the URI
    # ONCE to match a `location`, but `proxy_pass` with no URI part forwards the
    # ORIGINAL raw request line. Fastify then decodes once more. So the attacker
    # gets one free decode that nginx's matcher never sees:
    #
    #   request line   /%2561dmin/credits/abc/gift
    #   nginx $uri     /%61dmin/credits/abc/gift    <- does NOT match /admin
    #   forwarded      /%2561dmin/credits/abc/gift  <- raw, unnormalised
    #   Fastify routes /admin/credits/abc/gift      <- the mint, reached
    #
    # The discriminator is that a '%' SURVIVES nginx's decode. A legitimately
    # encoded path decodes cleanly and leaves none — `/v1/models/foo%2Fbar`
    # becomes `/v1/models/foo/bar`, verified — whereas a smuggled prefix leaves
    # a literal '%' behind, which is only reachable by sending '%25'. No client
    # of this API has a reason to double-encode a path, so this rejects the
    # whole class rather than the one spelling of it: '%2561dmin', '%41dmin',
    # and any encoding of `/internal/credits` are all covered by one rule.
    #
    # `if` at server level with a bare `return` is one of the two documented
    # safe uses of `if` (the "if is evil" caveat is about `if` inside `location`
    # with other directives). $uri is the decoded PATH only, so a query string
    # containing a percent is unaffected.
    if ($uri ~ "%") {
        return 400;
    }

    # ─────────────────────────────────────────────────────────────────────
    # SEC-0075 / BILL-0008 — the money-mint surfaces are not public.
    #
    # ►► THIS FILE IS THE SOURCE OF TRUTH, AND NOTHING APPLIES IT FOR YOU. ◄◄
    #
    # The host nginx on arcana-prod is MANUALLY MANAGED — it is not in the
    # Docker deploy and not in the GitHub Actions pipeline (see the header above
    # and deploy/nginx/README.md). Merging this commit changes nothing on the
    # live host. Until the operator/ops runs the scp + `nginx -t && systemctl
    # reload nginx` in deploy/nginx/README.md § Install / update on the host,
    # `POST /admin/credits/:id/gift` REMAINS WORLD-REACHABLE. Treat this block
    # as unapplied until the README's drift check reports "in sync".
    #
    # What is being closed. Consilium §6.1 verified that
    # `POST https://connector.arcanada.ai/admin/credits/:id/gift` is reachable
    # from the internet: this vhost proxies `location /` to 127.0.0.1:3900 with
    # no `/admin` denial, the container publishes only to loopback, so nginx is
    # the sole gate — and it was not gating. Guarded solely by one static
    # `ADMIN_TOKEN`, with no rate limit and no attribution. That is a
    # publicly-addressable money mint, and the consilium rated it more urgent
    # than BILL-0008 itself.
    #
    # Denying it at the PUBLIC vhost costs nothing legitimate: the gift runner
    # on the host talks to 127.0.0.1:3900 directly (operator-verified) and never
    # traverses nginx. There is no second door — connector.arcanada.one is a
    # pure 301 to this host and proxies nothing itself, and a 301 preserves the
    # path, so a request for /admin there lands on this deny.
    #
    # This is defence in depth, NOT a replacement for the guards. `deny all`
    # answers 403, which still confirms the path exists; AdminGuard and
    # PaymentsPrincipalGuard remain the actual authentication, and a caller that
    # reaches the app by any other route still has to pass them.
    #
    # On placement: these sit before `location /` for a human reader's benefit.
    # nginx itself selects the LONGEST matching prefix regardless of file order,
    # so `/admin` already beats `/` wherever it appears — do not rely on
    # ordering to keep a future deny effective, and do not assume moving a block
    # is safe because it "still comes first".

    # Every /admin route: `admin/keys` (key issuance), `admin/credits` (the
    # confirmed mint — gift, credit, reconcile, hold sweep) and
    # `admin/circuit-breaker`. All three are ADMIN_TOKEN-only, and the operator
    # reaches all three over loopback.
    #
    # Prefix matching here is case-SENSITIVE, and that is safe rather than a
    # gap: Fastify's router is case-sensitive too, so `/ADMIN/credits/x/gift`
    # 404s at the app instead of routing. Verified both halves — nginx proxies
    # it, Nest refuses it. If the adapter is ever switched to Express (whose
    # router is case-INSENSITIVE by default) this deny must become `~* ^/admin`
    # in the same change, or the mint reopens.
    location /admin {
        deny all;
    }

    # BILL-0008 — the payment credit-in path posts `payment` entries to the
    # ledger. Authenticated by PaymentsPrincipalGuard, but that guard is a
    # per-principal shared secret standing in for mesh identity (see
    # src/billing/payments-principal.guard.ts), and a secret is not a reason to
    # expose a money-minting route to the internet. control-bff reaches it over
    # the internal network, not through this vhost.
    location /internal/credits {
        deny all;
    }

    # NOT DENIED, deliberately: `/internal/watcher/circuit-breaker/reset`.
    #
    # The operator asked for the watcher-repair path to be fenced "if it is a
    # mint". It is not one — it calls ConnectorsService.resetCircuitBreaker and
    # touches no balance, no ledger and no key; it is an availability control
    # with its own scoped WATCHER_REPAIR_TOKEN. Blanket-denying `/internal`
    # would take it out along with the credit path and break a legitimate route
    # nobody decided to break, which is why the two `/internal` fences above and
    # here are written per-route rather than as one prefix.

    location / {
        limit_req zone=connector_api burst=20 nodelay;

        proxy_pass http://127.0.0.1:3900;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }

    location /health {
        proxy_pass http://127.0.0.1:3900/health;
        proxy_set_header Host $host;
    }
}

# connector.arcanada.ai — nginx reverse proxy vhost for Model Connector (:3900).
#
# SOURCE OF TRUTH. The live host copy is /etc/nginx/sites-available/connector.arcanada.ai.conf
# on arcana-prod (65.108.236.39). nginx is host-managed (not in the Docker deploy),
# so this file is the IaC mirror — edit HERE, then install per deploy/nginx/README.md.
#
# Rate limiting for Model Connector API.

server {
    listen 80;
    server_name connector.arcanada.ai;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name connector.arcanada.ai;

    ssl_certificate     /etc/nginx/ssl/wildcard.arcanada.ai.pem;
    ssl_certificate_key /etc/nginx/ssl/wildcard.arcanada.ai.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # MC requests can take up to 600s (Cursor CLI timeout)
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    client_max_body_size 32m;

    location / {
        limit_req zone=connector_api burst=20 nodelay;

        proxy_pass http://127.0.0.1:3900;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }

    # BILL-0008 — the payment credit-in path is NOT public.
    #
    # `POST /internal/credits/:apiKeyId/payment` posts a `payment` entry to the
    # ledger. It is authenticated by PaymentsPrincipalGuard, but that guard is a
    # per-principal shared secret standing in for mesh identity (see
    # src/billing/payments-principal.guard.ts), and a secret is not a reason to
    # expose a money-minting route to the internet. Defence in depth: the app
    # authenticates, nginx refuses to route at all.
    #
    # Placed BEFORE `location /`, which would otherwise proxy it: the container
    # publishes only to loopback, so this vhost is the sole gate.
    #
    # DELIBERATELY NARROW. It fences only the prefix this change introduced.
    # `/admin` is world-reachable through `location /` today and `/internal/
    # watcher/...` alongside it — that is consilium §6.1, filed as SEC-0075, and
    # it is a live exposure that predates this change and is being closed by its
    # own task. Widening this block to `/internal` or `/admin` here would look
    # like that fix without being it, and would break the watcher repair route
    # without anyone deciding to.
    location /internal/credits {
        deny all;
    }

    location /health {
        proxy_pass http://127.0.0.1:3900/health;
        proxy_set_header Host $host;
    }
}
